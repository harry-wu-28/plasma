[simulation]
  name    = "turbulence_2d"
  engine  = "srpic"
  runtime = 100.0

[grid]
  resolution = [256, 256]
  extent     = [[-64.0, 64.0], [-64.0, 64.0]]

  [grid.metric]
    metric = "minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"], ["PERIODIC"]]
    particles = [["PERIODIC"], ["PERIODIC"]]

[scales]
  larmor0    = 1.0
  skindepth0 = 1.0

[algorithms]
  current_filters = 4

  [algorithms.timestep]
    CFL = 0.5

[particles]
  ppc0 = 32.0

  [[particles.species]]
    label    = "e-_p"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 2e7

  [[particles.species]]
    label    = "e+_p"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 2e7

[setup]
  temperature = 1e0
  dB          = 1.0
  omega_0     = 0.0156
  gamma_0     = 0.0078


[output]
  format        = "BPFile"
  interval_time = 12.0

  [output.fields]
    enable = true
    quantities = ["N_1_2", "J", "B", "E"]

  [output.particles]
    enable = false

  [output.spectra]
    enable = false
  [output.stats]
    enable = true

[diagnostics]
  colored_stdout = true
